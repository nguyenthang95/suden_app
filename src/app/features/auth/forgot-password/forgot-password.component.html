<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="card p-8 w-full max-w-md">
    <h1 class="text-2xl font-black">{{ 'auth.forgotPassword' | translate }}</h1>
    <p class="text-slate-500">{{ 'auth.mockReset' | translate }}</p>
    <input
      class="input mt-5"
      [formControl]="email"
      [placeholder]="'auth.email' | translate"
    /><button class="btn btn-primary w-full mt-4" [disabled]="email.invalid">
      {{ 'auth.sendResetLink' | translate }}</button
    ><a routerLink="/login" class="text-[#3f61a8] block mt-4">{{
      'auth.backToLogin' | translate
    }}</a>
  </div>
</div>
