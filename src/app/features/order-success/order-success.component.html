<div class="container-page py-20 text-center">
  <div class="card p-10 max-w-xl mx-auto">
    <div class="text-6xl">✅</div>
    <h1 class="text-3xl font-black mt-4">{{ 'messages.orderPlaced' | translate }}</h1>
    <p class="text-slate-500">
      {{ 'messages.orderCodeLabel' | translate }} <b>{{ order()?.orderCode }}</b>
    </p>
    <p class="text-xl font-black mt-4">{{ (order()?.total ?? 0).toLocaleString('vi-VN') }} ₫</p>
    <div class="flex justify-center gap-3 mt-7">
      <a routerLink="/products" class="btn btn-secondary">{{
        'cart.continueShopping' | translate
      }}</a
      ><a routerLink="/account" class="btn btn-primary">{{ 'messages.viewOrder' | translate }}</a>
    </div>
  </div>
</div>
